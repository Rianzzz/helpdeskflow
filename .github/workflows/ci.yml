name: CI

on:
  push:
    branches: [main]
  pull_request:

# Princípio do menor privilégio: o pipeline só precisa LER o repositório.
permissions:
  contents: read

# Um push novo cancela a execução anterior da mesma branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restaurar
        run: dotnet restore HelpDeskFlow.sln

      - name: Compilar (avisos não passam em branco, mas não quebram)
        run: dotnet build HelpDeskFlow.sln --no-restore -c Release

      - name: Testes unitários
        run: dotnet test tests/HelpDeskFlow.UnitTests --no-build -c Release --logger "trx;LogFileName=unit.trx"

      # Os testes de integração sobem PostgreSQL e RabbitMQ reais com Testcontainers (o runner já tem Docker).
      - name: Testes de integração
        run: dotnet test tests/HelpDeskFlow.IntegrationTests --no-build -c Release --logger "trx;LogFileName=integration.trx"

      - name: Guardar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  web:
    name: Front-end (lint, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências (exatamente as do package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build de produção (inclui a checagem de tipos do TypeScript)
        run: npm run build

      - name: Checagem de tipos dos testes de navegador (Playwright)
        run: npm run typecheck:e2e

      - name: Auditoria de dependências (falha em vulnerabilidade alta ou crítica)
        run: npm audit --audit-level=high

  dependency-audit:
    name: Pacotes vulneráveis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Procurar pacotes NuGet com vulnerabilidades conhecidas (diretos e transitivos)
        run: |
          dotnet restore HelpDeskFlow.sln
          dotnet list HelpDeskFlow.sln package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "::error::Há pacotes vulneráveis. Veja o relatório acima."
            exit 1
          fi

  docker-e2e:
    name: Imagens Docker + fumaça + testes de navegador
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-and-test, web]
    steps:
      - uses: actions/checkout@v5

      - name: Configurar segredos efêmeros (valem só nesta execução)
        run: |
          {
            echo "JWT_SIGNING_KEY=$(openssl rand -base64 48)"
            # Os testes de navegador fazem muitos cadastros/logins por minuto do MESMO IP: sem isto o rate limit os barraria.
            echo "AUTH_RATE_LIMIT_PER_MINUTE=1000"
          } > .env

      - name: Construir imagens e subir a plataforma completa
        run: docker compose --profile apps up -d --build --wait --wait-timeout 300

      - name: Teste de fumaça (API pelo gateway e front-end pelo nginx)
        run: bash scripts/smoke-test.sh http://localhost:5000 http://localhost:3000

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências do front e o Chromium do Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Testes de navegador (Playwright) contra a plataforma em contêineres
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:3000
          # Permite o teste que reinicia o serviço de notificações (docker compose restart) e verifica a reconexão.
          E2E_CAN_RESTART_SERVICES: "1"
        run: npm run e2e

      - name: Guardar relatório do Playwright (screenshots e traces das falhas)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

      - name: Logs dos contêineres (se algo falhou)
        if: failure()
        run: docker compose --profile apps logs --no-color --tail=200

      - name: Derrubar
        if: always()
        run: docker compose --profile apps down -v

  kubernetes:
    name: Kubernetes (kind) - manifestos, seguranca do cluster e testes de navegador
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [build-and-test, web]
    steps:
      - uses: actions/checkout@v5

      # Instala so o binario do kind; quem cria o cluster (com as portas mapeadas) e o nosso script.
      - uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Os manifestos renderizam (todos os overlays)
        run: |
          kubectl kustomize k8s/overlays/kind > /dev/null
          kubectl kustomize k8s/overlays/production-example > /dev/null

      - name: Criar o cluster, construir as imagens e subir a plataforma (Pod Security restricted)
        run: bash scripts/k8s-kind.sh up

      - name: O overlay de producao e aceito pelo servidor do cluster (dry-run)
        run: kubectl kustomize k8s/overlays/production-example | kubectl apply --dry-run=server -f -

      - name: Teste de fumaca contra o cluster
        run: bash scripts/smoke-test.sh http://localhost:8089 http://localhost:8088

      - name: Garantias do cluster (Pod Security, NetworkPolicy, matar pods)
        run: bash scripts/k8s-verify.sh

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias do front e o Chromium do Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Testes de navegador (Playwright) contra o cluster
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8088
          E2E_CAN_RESTART_SERVICES: "1"
          E2E_RESTART_NOTIFICATIONS_CMD: kubectl -n helpdeskflow rollout restart deployment/notifications && kubectl -n helpdeskflow rollout status deployment/notifications --timeout=120s
        run: npm run e2e

      - name: Guardar relatorio do Playwright (screenshots e traces das falhas)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-k8s
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

      - name: Diagnostico do cluster (se algo falhou)
        if: failure()
        run: |
          kubectl -n helpdeskflow get pods -o wide
          kubectl -n helpdeskflow describe pods | tail -n 150
          for d in identity tickets tenants notifications gateway web; do
            echo "=== $d"; kubectl -n helpdeskflow logs "deployment/$d" --all-containers --tail=60 || true
          done
