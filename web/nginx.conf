# nginx que serve o front-end (arquivos estáticos) e repassa /api para o gateway.
# O navegador só conhece UMA origem: sem CORS e sem URL de API escrita no código.

server {
    listen 8080;
    server_name _;
    server_tokens off;                      # não anuncia a versão do nginx

    root /usr/share/nginx/html;
    index index.html;

    # Nome do serviço do gateway na rede do Docker (resolvido na hora, sem derrubar o nginx se ele ainda não existir).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8080;

    # Rota de saúde para o orquestrador (não passa pelo gateway).
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # API: tudo em /api vai para o gateway. Os cabeçalhos de segurança da API (CSP, no-store...) vêm do próprio gateway.
    location /api/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # o gateway usa isto para o rate limit por IP real
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
        client_max_body_size 1m;
    }

    # Arquivos com hash no nome (JS/CSS gerados pelo Vite): podem ser guardados em cache "para sempre".
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Qualquer outra rota é do React Router: devolve o index.html (que NÃO pode ficar em cache).
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
