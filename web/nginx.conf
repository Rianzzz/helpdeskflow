# nginx que serve o front-end (arquivos estáticos) e repassa /api e /hubs (tempo real) para o gateway.
# O navegador só conhece UMA origem: sem CORS e sem URL de API escrita no código.

# WebSocket: só pede "upgrade" da conexão quando o cliente pediu (senão, fecha normalmente).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# LOG SEM SEGREDOS. O navegador manda o JWT do tempo real em "?access_token=...", e o log padrão do nginx grava a URL
# completa ($request): o token iria parar nos arquivos de log (e em qualquer sistema que os colete). Este mapa troca o
# valor de "access_token" por [REDACTED] em TODA rota, inclusive quando alguém (por engano ou de má-fé) manda o token
# numa URL onde ele nem deveria estar.
map $request_uri $uri_sem_token {
    ~^(?<caminho>[^?]*)\?(?<antes>.*?)access_token=[^&]*(?<depois>.*)$  "$caminho?${antes}access_token=[REDACTED]$depois";
    default $request_uri;
}

log_format sem_segredos '$remote_addr - [$time_local] "$request_method $uri_sem_token $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    server_tokens off;                      # não anuncia a versão do nginx
    access_log /dev/stdout sem_segredos;    # vale para todas as rotas abaixo (exceto onde estiver "off")

    # IP REAL do cliente quando há um proxy na frente (ex.: o ingress do Kubernetes): o arquivo montado em real-ip.d
    # diz de quais redes confiamos para ler o X-Forwarded-For. Sem proxy (docker compose) a pasta só tem um comentário.
    # Importante para o rate limit por IP do gateway: sem isto, todos os usuários pareceriam o IP do ingress.
    include /etc/nginx/real-ip.d/*.conf;

    root /usr/share/nginx/html;
    index index.html;

    # Onde está o gateway e qual DNS resolve o nome dele. O DNS vem de NGINX_LOCAL_RESOLVERS, que a imagem oficial preenche
    # sozinha a partir do /etc/resolv.conf (Docker: 127.0.0.11; Kubernetes: o kube-dns): funciona nos dois sem ajuste.
    # NGINX_GATEWAY_URL tem padrão no Dockerfile e pode ser trocada. O nome é resolvido na hora, sem derrubar o nginx
    # se o gateway ainda não existir.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $gateway ${NGINX_GATEWAY_URL};

    # Rota de saúde para o orquestrador (não passa pelo gateway).
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # API: tudo em /api vai para o gateway. Os cabeçalhos de segurança da API (CSP, no-store...) vêm do próprio gateway.
    location /api/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # o gateway usa isto para o rate limit por IP real
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
        client_max_body_size 1m;
    }

    # Tempo real (SignalR): conexão longa, com "upgrade" para WebSocket, repassada ao gateway.
    location /hubs/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;                       # mensagens saem na hora, sem esperar encher um buffer
        proxy_read_timeout 120s;                   # o SignalR envia um "ping" a cada 15 s; 2 min só derrubam conexões mortas
        proxy_send_timeout 120s;
        client_max_body_size 8k;                   # o cliente quase não envia nada
    }

    # Arquivos com hash no nome (JS/CSS gerados pelo Vite): podem ser guardados em cache "para sempre".
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Qualquer outra rota é do React Router: devolve o index.html (que NÃO pode ficar em cache).
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
