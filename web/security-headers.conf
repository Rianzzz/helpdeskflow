# Cabeçalhos de segurança do front-end. (Em nginx, "add_header" dentro de um location substitui os do server,
# por isso este arquivo é incluído em cada location.)

# CSP: o navegador só executa JS e carrega CSS que venham DESTA origem. Mesmo que alguém consiga injetar
# HTML na página (XSS), scripts inline ou de outros domínios não executam, e nada pode ser enviado a terceiros.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
