# Gateway (YARP): a entrada única da API. Valida o JWT, aplica rate limit por empresa e repassa aos serviços.
# Sem banco de dados. As rotas e os destinos vêm do ConfigMap (nomes de Service do Kubernetes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: helpdeskflow
    helpdeskflow/runtime: dotnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: helpdeskflow
        helpdeskflow/tier: edge
    spec:
      containers:
        - name: app
          image: helpdeskflow/gateway:dev
          ports:
            - { name: http, containerPort: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: helpdeskflow
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - { name: http, port: 8080, targetPort: http }
