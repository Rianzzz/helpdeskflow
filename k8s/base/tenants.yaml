# Tenants: perfil e plano da empresa, passo central da saga de onboarding (PostgreSQL + RabbitMQ).
# Segurança do pod, probes e recursos vêm de patches/ (iguais para todos os serviços .NET).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenants
  labels:
    app.kubernetes.io/name: tenants
    app.kubernetes.io/part-of: helpdeskflow
    helpdeskflow/runtime: dotnet
    helpdeskflow/uses-database: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tenants
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } # nunca derruba o único pod antes de o novo estar pronto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenants
        app.kubernetes.io/part-of: helpdeskflow
        helpdeskflow/tier: backend
    spec:
      initContainers:
        - name: migrate # aplica as migrations do banco e encerra; o app só sobe depois (réplicas simultâneas são seguras)
          image: helpdeskflow/tenants:dev
          args: ["--migrate-only"]
          env: &db-env
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: helpdeskflow-config, key: POSTGRES_HOST } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: helpdeskflow-secrets, key: postgres-password } }
            - name: ConnectionStrings__TenantsDb
              value: Host=$(POSTGRES_HOST);Port=5432;Database=helpdesk_tenants;Username=helpdesk;Password=$(POSTGRES_PASSWORD)
      containers:
        - name: app
          image: helpdeskflow/tenants:dev
          ports:
            - { name: http, containerPort: 8080 }
          env: *db-env
---
apiVersion: v1
kind: Service
metadata:
  name: tenants
  labels:
    app.kubernetes.io/name: tenants
    app.kubernetes.io/part-of: helpdeskflow
spec:
  selector:
    app.kubernetes.io/name: tenants
  ports:
    - { name: http, port: 8080, targetPort: http }