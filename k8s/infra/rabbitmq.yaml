# RabbitMQ para DESENVOLVIMENTO/TESTE (um único pod, com disco para as filas durarem a reinícios).
# Em produção use o RabbitMQ Cluster Operator ou um serviço gerenciado e aponte RabbitMq__Host no ConfigMap para ele.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: helpdeskflow
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: helpdeskflow
        helpdeskflow/tier: data
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # usuário "rabbitmq" da imagem oficial
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rabbitmq
          image: rabbitmq:4
          ports:
            - { name: amqp, containerPort: 5672 }
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: helpdesk }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: helpdeskflow-secrets, key: rabbitmq-password } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: helpdeskflow
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
